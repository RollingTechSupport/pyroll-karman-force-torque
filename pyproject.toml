[project]
name = "pyroll-flat-rolling-slab-model"
description = "Plugin for PyRoll providing flat-rolling slab-theory models (von-Karman/Orowan/layer/foil) for roll force, torque and neutral point."
authors = [
    { name = "Christoph Renzing", email = "christoph.renzing@imf.tu-freiberg.de" }
]
license = "BSD-3-Clause"
homepage = "https://pyroll-project.github.io/"
repository = "https://github.com/pyroll-project/pyroll-flat-rolling-slab-model"
documentation = "https://github.com/pyroll-project/pyroll-flat-rolling-slab-model/blob/main/docs/docs.pdf"

readme = "README.md"
classifiers = [
    "Intended Audience :: Science/Research",
    "Intended Audience :: Manufacturing",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering"
]

requires-python = ">=3.9, <4.0"
dependencies = [
    "pyroll-core",
    "numdifftools",
    "pandas ~= 2.0",
]

dynamic = ["version"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = [
    "slow: numerically heavy tests (foil-rolling elastic-flattening iteration); deselect with '-k \"not slow\"'",
]